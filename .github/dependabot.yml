# Actions are pinned to commit SHAs, which is the right call for supply-chain reasons but
# means a human has to notice a new release - so let Dependabot be that human.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      # ci: keeps these out of the release bump inference in ci.yml - an action bump
      # must not cut a release on its own.
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      test-stack:
        patterns:
          - xunit.v3
